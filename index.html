<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PersonalPTF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080c14">
  <title>PersonalPTF</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="onboarding.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login-screen" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--bg,#080c14);align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:320px">
    <div style="text-align:center;margin-bottom:28px">
      <div class="logo-mark" style="margin:0 auto 12px">P</div>
      <div style="font-size:18px;font-weight:700;color:var(--text,#e8eef7)">PersonalPTF</div>
      <div style="font-size:12px;color:var(--text3,#7a8fa8);margin-top:4px">Accedi per continuare</div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" autocomplete="username" placeholder="nome@esempio.it">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div id="login-error" style="display:none;font-size:12px;color:var(--red,#ff4d6a);margin-bottom:10px"></div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Accedi</button>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <div class="logo">
      <div class="logo-mark">P</div>
      <span class="logo-name">PersonalPTF</span>
      <span class="live-badge" id="live-badge">LIVE</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="openForm()" title="Nuova operazione">+</button>
      <button class="icon-btn refresh-btn" id="refresh-prices-btn" onclick="refreshPrices(this)" title="Aggiorna">↻</button>
      <span class="update-time" id="update-time">--</span>
    </div>
  </div>
  <div id="content">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span id="loading-text">Caricamento dati...</span>
    </div>
    <div id="page-content" style="display:none"></div>
  </div>
  <nav id="navbar">
    <button class="nav-item active" onclick="setTab('overview')" id="tab-overview">
      <span class="nav-icon">◈</span><span class="nav-label">Home</span>
    </button>
    <button class="nav-item" onclick="setTab('performance')" id="tab-performance">
      <span class="nav-icon">↗</span><span class="nav-label">Perf</span>
    </button>
    <button class="nav-item" onclick="setTab('posizioni')" id="tab-posizioni">
      <span class="nav-icon">◆</span><span class="nav-label">Posizioni</span>
    </button>
    <button class="nav-item" onclick="setTab('news')" id="tab-news">
      <span class="nav-icon">📰</span><span class="nav-label">News</span>
    </button>
    <button class="nav-item" onclick="setTab('ai')" id="tab-ai">
      <span class="nav-icon">🤖</span><span class="nav-label">AI</span>
    </button>
    <button class="nav-item" onclick="setTab('mandate')" id="tab-mandate">
      <span class="nav-icon">⊞</span><span class="nav-label">Mandate</span>
    </button>
    <button class="nav-item" onclick="setTab('settings')" id="tab-settings">
      <span class="nav-icon">⚙</span><span class="nav-label">Setup</span>
    </button>
  </nav>
  <div class="modal-overlay" id="modal-overlay" onclick="closeForm()"></div>
  <div class="modal" id="modal-form">
    <div class="modal-header">
      <span class="modal-title">Nuova Operazione</span>
      <button class="modal-close" onclick="closeForm()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Tipo operazione</label>
        <div class="radio-group">
          <button class="radio-btn active" onclick="setTipo('BUY', this)">BUY</button>
          <button class="radio-btn" onclick="setTipo('SELL', this)">SELL</button>
          <button class="radio-btn" onclick="setTipo('PAC', this)">PAC</button>
        </div>
      </div>
      <div class="form-group">
        <label>Ticker</label>
        <input type="text" id="f-ticker" placeholder="es. SWDA.MI" autocomplete="off" style="text-transform:uppercase">
      </div>
      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="f-nome" placeholder="es. iShares MSCI World">
      </div>
      <div class="form-group">
        <label>Asset Class</label>
        <select id="f-ac">
          <option value="ETF">ETF</option>
          <option value="Azioni">Azioni</option>
          <option value="Crypto">Crypto</option>
          <option value="Fondi">Fondi</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Quantità</label>
          <input type="number" id="f-qty" placeholder="0" step="any">
        </div>
        <div class="form-group">
          <label>Prezzo €</label>
          <input type="number" id="f-price" placeholder="0.00" step="any">
        </div>
      </div>
      <div class="form-group">
        <label>Commissione €</label>
        <input type="number" id="f-comm" placeholder="0.00" step="any" value="0">
      </div>
      <div class="form-group">
        <label>Data</label>
        <input type="date" id="f-date">
      </div>
      <div class="form-group">
        <label>Note</label>
        <input type="text" id="f-note" placeholder="opzionale">
      </div>
      <div class="form-summary" id="form-summary"></div>
      <button class="btn-primary" onclick="submitForm()" id="submit-btn">Conferma operazione</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="data.js"></script>
<script src="prices-ui.js"></script>
<script src="settings-nav.js"></script>
<script src="settings.js"></script>
<script src="profile-logic.js"></script>
<script src="profile-store.js"></script>
<script src="onboarding-ui.js"></script>
<script src="settings-profile.js"></script>
<script src="settings-assets.js"></script>
</body>
</html>
